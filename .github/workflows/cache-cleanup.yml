name: Cache cleanup

# The Actions cache holds 10 GB per repository, and GitHub evicts the oldest
# entries past that. A pull request's caches are only readable by that pull
# request, so once it closes they are dead weight that pushes out main's, which
# every pull request reads.
#
# When a pull request closes, merged or not, this deletes its caches. Run it by
# hand to sweep the caches of every closed pull request.
#
# pull_request_target, so that a pull request from a fork gets a token that can
# delete caches. It checks out no code and runs nothing from the pull request.

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete closed pull requests' caches
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Delete the caches
        run: |
          set -euo pipefail
          # GitHub throttles a burst of cache requests (HTTP 429), so deletes
          # go one at a time, which ran at about three a second, and a
          # throttled call waits a minute and is tried again, up to five times.
          retry() {
            local n
            for n in 1 2 3 4 5; do
              "$@" && return 0
              echo "throttled, waiting a minute" >&2
              sleep 60
            done
            "$@"
          }
          # Every cache of one ref, a page at a time. A cache that still can't
          # be deleted stops this ref, so nothing can loop for good.
          delete_ref() {
            local ref=$1 ids id n=0
            while ids=$(retry gh cache list --ref "$ref" --limit 100 --json id --jq '.[].id') && [ -n "$ids" ]; do
              for id in $ids; do
                if ! retry gh cache delete "$id" >/dev/null; then
                  echo "::warning::$ref: cache $id could not be deleted"
                  break 2
                fi
                n=$((n + 1))
              done
            done
            echo "$ref: deleted $n"
          }
          if [ -n "$PR" ]; then
            delete_ref "refs/pull/$PR/merge"
          else
            # Every pull request ref with caches whose pull request is closed.
            refs=$(retry gh api --paginate "repos/$GH_REPO/actions/caches?per_page=100" \
                     --jq '.actions_caches[].ref' | grep -E '^refs/pull/[0-9]+/merge$' | sort -u || true)
            for ref in $refs; do
              num=${ref#refs/pull/}; num=${num%/merge}
              if [ "$(retry gh pr view "$num" --json state --jq .state)" != OPEN ]; then
                delete_ref "$ref"
              fi
            done
          fi
